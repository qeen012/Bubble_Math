<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>可愛動物泡泡救援隊</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background: #E8ECEF; /* 莫蘭迪藍灰底色 */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #4A5568;
    }
    #game-container {
      width: 95%;
      max-width: 550px;
      background: #F7FAFC;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(112, 128, 144, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #E2E8F0;
    }
    
    /* Header Info */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #EDF2F7;
      padding: 12px 18px;
      border-radius: 16px;
      margin-bottom: 20px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #4A5568;
    }
    .timer { color: #C57B57; font-size: 1.25rem; font-weight: bold; }
    .badge {
      background: #CBD5E0;
      color: #2D3748;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    .badge.boss {
      background: #E2B4BD;
      color: #6B3A44;
    }
    
    /* Stage Area */
    .stage-area {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #FFFFFF;
      border-radius: 20px;
      border: 2px dashed #CBD5E0;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    /* Normal Animal Bubble */
    .bubble {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(184, 197, 209, 0.5));
      box-shadow: 0 6px 15px rgba(148, 163, 184, 0.2), inset 0 0 12px rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.8rem;
      animation: float 3s ease-in-out infinite;
      border: 1px solid #D2D6DC;
    }
    
    /* Boss Rare Animal Bubble */
    .rare-bubble {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(216, 180, 160, 0.5));
      border: 3px solid #D8B4A0;
      box-shadow: 0 8px 20px rgba(216, 180, 160, 0.3), inset 0 0 15px rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.8rem;
      animation: float 2.5s ease-in-out infinite;
    }
    
    .target-numbers {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }
    .num-tag {
      background: #B8C5D6;
      color: #2D3748;
      padding: 6px 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .num-tag.cleared {
      background: #A3B18A;
      color: #FFFFFF;
      opacity: 0.5;
      text-decoration: line-through;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .question {
      font-size: 1.4rem;
      font-weight: bold;
      color: #334155;
      margin-bottom: 18px;
    }
    
    /* Options Grid */
    .options-grid {
      display: grid;
      gap: 12px;
      width: 100%;
    }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-1 { grid-template-columns: 1fr; }
    
    .btn-opt {
      background: #94A3B8;
      color: #FFFFFF;
      border: none;
      padding: 14px 10px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 8px rgba(148, 163, 184, 0.3);
    }
    .btn-opt:hover {
      background: #78889E;
      transform: translateY(-2px);
    }
    .btn-opt:active { transform: translateY(0); }
    .btn-opt:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      background: #CBD5E0;
    }

    /* Modal / Certificate */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(247, 250, 252, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }
    .cert-card {
      border: 2px solid #CBD5E0;
      border-radius: 20px;
      padding: 30px 20px;
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cert-medal-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }
    .cert-title-single {
      font-size: 1.5rem;
      color: #334155;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .cert-animals-display {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 1.8rem;
      margin-bottom: 25px;
      max-height: 120px;
      overflow-y: auto;
      width: 100%;
      padding: 10px;
      background: #F8FAFC;
      border-radius: 12px;
    }
    .restart-btn {
      background: #84A98C;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(132, 169, 140, 0.4);
      transition: all 0.2s ease;
    }
    .restart-btn:hover {
      background: #6B9080;
      transform: translateY(-2px);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Header Info -->
  <div class="header">
    <div>倒數時間: <span id="timer" class="timer">05:00</span></div>
    <div id="stage-badge" class="badge">一般救援 (1/7)</div>
    <div>救援: <span id="total-count" style="color:#5B7065; font-size:1.25rem;">0</span> 隻</div>
  </div>

  <!-- Stage Area -->
  <div class="stage-area">
    <div id="normal-stage">
      <div class="bubble" id="normal-animal">🐶</div>
    </div>
    
    <div id="rare-stage" class="hidden">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div class="rare-bubble" id="rare-animal">🦄</div>
        <div class="target-numbers" id="target-numbers">
          <!-- Numbers only -->
        </div>
      </div>
    </div>
  </div>

  <!-- Question & Options -->
  <div id="question" class="question">載入中...</div>
  <div id="options" class="options-grid grid-3">
    <!-- Option buttons -->
  </div>

  <!-- Certificate Modal -->
  <div id="cert-modal" class="modal hidden">
    <div class="cert-card">
      <div id="cert-medal-icon" class="cert-medal-icon">🥇</div>
      <div id="cert-single-line" class="cert-title-single">動物救援小英雄 金牌</div>
      
      <div id="cert-animals-display" class="cert-animals-display">
        <!-- Animal Icons -->
      </div>

      <button class="restart-btn" onclick="startGame()">再次挑戰 🔄</button>
    </div>
  </div>
</div>

<script>
  // Animals List
  const normalAnimals = ['🐶','🐱','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮'];
  const rareAnimals = ['🦄','🐲','🦅','🐉','🐺','🦁'];

  // Game States
  let timeLeft = 300;
  let timerInterval = null;
  let totalRescued = 0;
  let rescuedAnimalsLog = [];
  
  let currentStageStep = 0;
  let isRareStage = false;
  
  // Rare Stage States
  let rareTargets = [];
  let rareCleared = [];
  let currentQuestions = [];

  // DOM Elements
  const timerEl = document.getElementById('timer');
  const stageBadgeEl = document.getElementById('stage-badge');
  const totalCountEl = document.getElementById('total-count');
  const normalStageEl = document.getElementById('normal-stage');
  const rareStageEl = document.getElementById('rare-stage');
  const normalAnimalEl = document.getElementById('normal-animal');
  const rareAnimalEl = document.getElementById('rare-animal');
  const targetNumbersEl = document.getElementById('target-numbers');
  const questionEl = document.getElementById('question');
  const optionsEl = document.getElementById('options');
  const certModal = document.getElementById('cert-modal');

  function startGame() {
    timeLeft = 300;
    totalRescued = 0;
    rescuedAnimalsLog = [];
    currentStageStep = 0;
    isRareStage = false;
    
    certModal.classList.add('hidden');
    updateHeader();
    
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
    
    nextQuestion();
  }

  function updateTimer() {
    timeLeft--;
    let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    let s = (timeLeft % 60).toString().padStart(2, '0');
    timerEl.innerText = `${m}:${s}`;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }

  function updateHeader() {
    totalCountEl.innerText = totalRescued;
    if (!isRareStage) {
      stageBadgeEl.innerText = `一般救援 (${currentStageStep + 1}/7)`;
      stageBadgeEl.className = "badge";
    } else {
      stageBadgeEl.innerText = `魔王關卡`;
      stageBadgeEl.className = "badge boss";
    }
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateMathProblem(targetAns = null) {
    let num1, num2, op, ans;
    const ops = ['+', '-'];
    
    if (targetAns !== null) {
      ans = targetAns;
      op = ops[getRandomInt(0, 1)];
      if (op === '+') {
        num1 = getRandomInt(1, ans - 1 || 1);
        num2 = ans - num1;
      } else {
        num2 = getRandomInt(5, 25);
        num1 = ans + num2;
      }
    } else {
      op = ops[getRandomInt(0, 1)];
      if (op === '+') {
        num1 = getRandomInt(10, 45);
        num2 = getRandomInt(5, 40);
        ans = num1 + num2;
      } else {
        num1 = getRandomInt(20, 75);
        num2 = getRandomInt(5, num1 - 1);
        ans = num1 - num2;
      }
    }
    return { expr: `${num1} ${op} ${num2}`, ans: ans };
  }

  function nextQuestion() {
    updateHeader();
    optionsEl.innerHTML = '';

    if (currentStageStep < 7) {
      // Normal Stage
      isRareStage = false;
      normalStageEl.classList.remove('hidden');
      rareStageEl.classList.add('hidden');
      
      const animal = normalAnimals[getRandomInt(0, normalAnimals.length - 1)];
      normalAnimalEl.innerText = animal;
      normalAnimalEl.dataset.currentAnimal = animal;
      
      const prob = generateMathProblem();
      questionEl.innerText = `${prob.expr} = ?`;
      
      // 3 Options for Normal Stage
      let choices = [prob.ans];
      while(choices.length < 3) {
        let wrong = prob.ans + getRandomInt(-8, 8);
        if (wrong > 0 && !choices.includes(wrong)) choices.push(wrong);
      }
      choices.sort(() => Math.random() - 0.5);

      optionsEl.className = "options-grid grid-3";
      choices.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = opt;
        btn.onclick = () => checkNormalAnswer(opt, prob.ans);
        optionsEl.appendChild(btn);
      });

    } else {
      // Boss Rare Stage
      setupRareStage();
    }
  }

  function checkNormalAnswer(selected, correct) {
    if (selected === correct) {
      totalRescued++;
      rescuedAnimalsLog.push(normalAnimalEl.dataset.currentAnimal);
      currentStageStep++;
      nextQuestion();
    } else {
      alert("答錯囉！再算一次看看！");
    }
  }

  function setupRareStage() {
    isRareStage = true;
    updateHeader();
    normalStageEl.classList.add('hidden');
    rareStageEl.classList.remove('hidden');

    const rareAnimal = rareAnimals[getRandomInt(0, rareAnimals.length - 1)];
    rareAnimalEl.innerText = rareAnimal;
    rareAnimalEl.dataset.currentAnimal = rareAnimal;

    // Generate 3 unique target numbers
    rareTargets = [];
    while(rareTargets.length < 3) {
      let t = getRandomInt(15, 65);
      if(!rareTargets.includes(t)) rareTargets.push(t);
    }
    rareCleared = [false, false, false];

    renderRareTargets();

    // Generate 5 Equations
    let questions = [];
    rareTargets.forEach(target => {
      questions.push(generateMathProblem(target));
    });
    while(questions.length < 5) {
      let dummy = generateMathProblem();
      if(!rareTargets.includes(dummy.ans)) {
        questions.push(dummy);
      }
    }
    questions.sort(() => Math.random() - 0.5);
    currentQuestions = questions;

    questionEl.innerText = "解開對應數字的算式！";
    optionsEl.className = "options-grid grid-1";

    renderRareOptions();
  }

  function renderRareTargets() {
    targetNumbersEl.innerHTML = '';
    rareTargets.forEach((num, idx) => {
      const tag = document.createElement('div');
      tag.className = `num-tag ${rareCleared[idx] ? 'cleared' : ''}`;
      tag.innerText = num;
      targetNumbersEl.appendChild(tag);
    });
  }

  function renderRareOptions() {
    optionsEl.innerHTML = '';
    currentQuestions.forEach((q, idx) => {
      const btn = document.createElement('button');
      btn.className = 'btn-opt';
      btn.innerText = `${q.expr} = ?`;
      if(q.solved) btn.disabled = true;
      
      btn.onclick = () => checkRareAnswer(q, idx);
      optionsEl.appendChild(btn);
    });
  }

  function checkRareAnswer(q, qIdx) {
    const targetIdx = rareTargets.indexOf(q.ans);
    
    if (targetIdx !== -1 && !rareCleared[targetIdx]) {
      rareCleared[targetIdx] = true;
      currentQuestions[qIdx].solved = true;
      renderRareTargets();
      renderRareOptions();

      if (rareCleared.every(c => c === true)) {
        setTimeout(() => {
          totalRescued++;
          rescuedAnimalsLog.push(rareAnimalEl.dataset.currentAnimal);
          currentStageStep = 0;
          nextQuestion();
        }, 150);
      }
    } else {
      alert("答案沒有在上面的數字中喔！");
    }
  }

  function endGame() {
    let medalIcon = "";
    let titleText = "";
    
    if (totalRescued >= 30) {
      medalIcon = "🥇";
      titleText = "動物救援小英雄 金牌";
    } else if (totalRescued >= 20) {
      medalIcon = "🥈";
      titleText = "動物救援小英雄 銀牌";
    } else if (totalRescued >= 10) {
      medalIcon = "🥉";
      titleText = "動物救援小英雄 銅牌";
    } else {
      medalIcon = "🎖️";
      titleText = "動物救援小英雄 實習救援官";
    }
    
    document.getElementById('cert-medal-icon').innerText = medalIcon;
    document.getElementById('cert-single-line').innerText = titleText;
    
    const animalsDisplay = document.getElementById('cert-animals-display');
    animalsDisplay.innerHTML = '';
    rescuedAnimalsLog.forEach(animal => {
      const span = document.createElement('span');
      span.innerText = animal;
      animalsDisplay.appendChild(span);
    });

    certModal.classList.remove('hidden');
  }

  startGame();
</script>
</body>
</html>
